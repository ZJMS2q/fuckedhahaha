<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAHAHA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    overflow:hidden;
    font-family:Consolas, monospace;
}

/* Fundo estilo hacker */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    repeating-linear-gradient(
        0deg,
        rgba(0,255,0,.08) 0px,
        rgba(0,255,0,.08) 2px,
        transparent 2px,
        transparent 4px
    );
    animation:scan 8s linear infinite;
    opacity:.5;
}

body::after{
    content:"01010110 01101001 01110010 01110101 01110011 00100000 01000001 01100011 01100011 01100101 01110011 01110011";
    position:fixed;
    inset:0;
    color:rgba(0,255,0,.08);
    font-size:20px;
    line-height:30px;
    white-space:pre-wrap;
    padding:20px;
    overflow:hidden;
    pointer-events:none;
}

h1{
    color:#00ff00;
    font-size:70px;
    text-align:center;
    text-shadow:
        0 0 10px #00ff00,
        0 0 20px #00ff00,
        0 0 40px #00ff00;
    z-index:1;
    animation:glitch .15s infinite alternate;
}

@keyframes scan{
    from{transform:translateY(-100%);}
    to{transform:translateY(100%);}
}

@keyframes glitch{
    from{transform:translateX(-2px);}
    to{transform:translateX(2px);}
}
</style>
</head>

<body>
    <h1>SISTEMA INVADIDO BY ZJMS2</h1>
</body>
</html>
